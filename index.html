<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Princep Kart Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: seller-panel shell. Fixed navy sidebar with the Princep Kart logo top-left on desktop; on phones the logo sits in the top bar and navigation moves to a bottom bar. Work area is a card grid. */
:root{
  --font-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#EBEFF6;--ink:#142036;--ink-2:#56627A;--line:#DCE2EC;
  --accent:#1F4FD1;--accent-ink:#FFFFFF;--gold:#E3A622;
  --side:#0E1D3A;--side-ink:#B9C6E2;--side-active:#1B2F57;
  --good:#11803E;--warn:#9A5800;--bad:#C0281C;--info:#2A5BA8;
  --good-bg:#DEF2E5;--warn-bg:#FBEBD0;--bad-bg:#FBE1DE;--info-bg:#E1EAF8;--neutral-bg:#E9EDF4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A111F;--surface:#111B30;--surface-2:#17233D;--ink:#E7EDF8;--ink-2:#97A6C3;--line:#22314F;
  --accent:#6C93FF;--accent-ink:#0A1530;--gold:#F0BC45;
  --side:#070D1A;--side-ink:#AEBBD6;--side-active:#14213C;
  --good:#4CC983;--warn:#E5A64E;--bad:#F28279;--info:#8DB4F0;
  --good-bg:#12301F;--warn-bg:#352711;--bad-bg:#3A1B1C;--info-bg:#15264A;--neutral-bg:#1B2842;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111F;--surface:#111B30;--surface-2:#17233D;--ink:#E7EDF8;--ink-2:#97A6C3;--line:#22314F;
  --accent:#6C93FF;--accent-ink:#0A1530;--gold:#F0BC45;
  --side:#070D1A;--side-ink:#AEBBD6;--side-active:#14213C;
  --good:#4CC983;--warn:#E5A64E;--bad:#F28279;--info:#8DB4F0;
  --good-bg:#12301F;--warn-bg:#352711;--bad-bg:#3A1B1C;--info-bg:#15264A;--neutral-bg:#1B2842;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono);font-size:12.5px}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* logo + sidebar */
.logo{display:flex;align-items:center;gap:11px}
.logo svg{width:42px;height:42px;flex:none}
.wm b{display:block;font:700 15px/1.1 var(--font-brand);letter-spacing:.09em;white-space:nowrap}
.wm span{display:block;font:500 11.5px var(--font-body);margin-top:3px;letter-spacing:.02em;color:var(--ink-2)}
.sidebar{display:none}
.mlogo .wm b{color:var(--ink)}
.sidebar .wm b{color:#fff}.sidebar .wm span{color:var(--side-ink)}
.nav{display:grid;gap:3px;margin-top:26px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--side-ink);font:600 14px var(--font-body);cursor:pointer;text-align:left;position:relative}
.nav button:hover{background:var(--side-active)}
.nav svg{width:19px;height:19px;flex:none}
.nav button[aria-selected=true]{background:var(--side-active);color:#fff}
.nav button[aria-selected=true]::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--side-ink)}
.side-foot b{display:block;color:#fff;font-weight:700;margin-bottom:2px}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.mlogo{order:1;flex:1;min-width:0}
.newbtn{order:2}
.scan{order:3;flex:1 1 100%;display:flex;gap:8px}
.scan input[type=text]{flex:1;min-width:0}
.scan select{width:auto;max-width:150px}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}
/* bottom nav (phones) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink-2);font:600 10.5px var(--font-body);padding:6px 2px;cursor:pointer}
.bnav svg{width:21px;height:21px}
.bnav button[aria-selected=true]{color:var(--accent)}
main#view{padding-block:20px 104px}
@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);padding:22px 16px 18px max(18px,env(safe-area-inset-left,0px));z-index:40}
  .main{margin-left:248px}
  .bnav,.mlogo{display:none}
  .scan{order:1;flex:1;max-width:640px}
  .newbtn{order:2;margin-left:auto}
  main#view{padding-block:26px 64px}
}
/* controls */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:600 14px var(--font-body);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{padding:0 12px}
.btn svg{width:18px;height:18px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.eyebrow{font:700 11.5px var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);margin-top:12px}
.empty{color:var(--ink-2);padding:26px 10px;text-align:center;border:1px dashed var(--line);border-radius:10px}
/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font:800 26px/1.15 var(--font-display);letter-spacing:-.02em;margin:0}
.ph p{margin:4px 0 0;color:var(--ink-2)}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-r select{width:auto}
.ph-r input{width:min(260px,100%)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,32,64,.05);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card-h h2{font:700 15px/1.2 var(--font-display);margin:0}
.card-h small{color:var(--ink-2);font-size:12.5px}
.cols2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.cols2>*{min-width:0}
@media (min-width:900px){.cols2{grid-template-columns:1fr 1fr}}
.hero{background:var(--side);color:#fff;border-radius:14px;padding:20px 22px}
.hero .eyebrow{color:var(--side-ink)}
.hero .bar-g{width:44px;height:3px;background:var(--gold);border-radius:2px;margin-bottom:12px}
.hero-n{font:800 clamp(34px,8vw,48px)/1.05 var(--font-display);letter-spacing:-.02em;margin:6px 0 2px}
.hero-n.bad{color:#FF9B93}
.hero-stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:14px}
.hs b{display:block;font:700 17px var(--font-display)}
.hs span{font-size:12px;color:var(--side-ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}
.kpi{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(16,32,64,.05)}
.kpi .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.kpi .ic.g{background:var(--good-bg);color:var(--good)}.kpi .ic.w{background:var(--warn-bg);color:var(--warn)}.kpi .ic.r{background:var(--bad-bg);color:var(--bad)}
.kpi .ic svg{width:20px;height:20px}
.kpi b{display:block;font:800 22px/1.2 var(--font-display);margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.att li:first-child{border-top:0;padding-top:0}
.att .ct{min-width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:800 15px var(--font-display)}
.att .tx{flex:1;min-width:0}.att .tx small{display:block;color:var(--ink-2);font-size:12.5px}
.flow{display:grid;gap:12px}
.flow .fr{display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}.bar i.o{background:var(--gold)}
svg.chart text{fill:var(--ink-2);font:11px var(--font-body)}
svg.chart .pos{fill:var(--accent)}svg.chart .neg{fill:var(--bad)}
svg.chart .grid{stroke:var(--line);stroke-width:1}svg.chart .zero{stroke:var(--ink-2);stroke-width:1}
svg.chart .v{fill:var(--ink);font-weight:700}
.chartbox{overflow-x:auto}
.tbl{overflow-x:auto}
.tr{display:grid;grid-template-columns:minmax(120px,2fr) repeat(3,minmax(64px,1fr));gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tr.h{font:700 11.5px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);border-top:0;padding-top:0}
.tr>div:not(:first-child){text-align:right}
.tr small{display:block;color:var(--ink-2)}
/* pills, chips */
.pill{display:inline-block;font:700 11.5px/1 var(--font-body);padding:5px 9px;border-radius:99px;background:var(--neutral-bg);color:var(--ink-2);white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 13px;font:600 13px var(--font-body);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* orders table */
.otable{display:grid;gap:8px}
.oh{display:none}
.orow,.oh{grid-template-columns:1fr 1fr auto;grid-template-areas:"prod prod status" "id id val" "date plat profit" "next next next"}
.orow{display:grid;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:inherit}
.orow>*,.oh>*{min-width:0}
.c-prod{grid-area:prod;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-id{grid-area:id;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-date{grid-area:date;color:var(--ink-2)}
.c-plat{grid-area:plat;color:var(--ink-2)}
.c-status{grid-area:status;justify-self:end}
.c-val{grid-area:val;justify-self:end;text-align:right;font-weight:700}
.c-profit{grid-area:profit;justify-self:end;text-align:right;font-weight:600}
.c-next{grid-area:next;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.orow:hover{border-color:var(--accent)}
.c-next.bad{color:var(--bad)}.c-next.warn{color:var(--warn)}.c-next.good{color:var(--good)}
@media (min-width:900px){
  .otable{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .oh,.orow{grid-template-columns:minmax(140px,2.2fr) minmax(130px,1.7fr) 70px 80px 92px 84px 92px minmax(120px,1.6fr);grid-template-areas:"prod id date plat status val profit next";gap:12px;padding:11px 16px}
  .oh{display:grid;background:var(--surface-2);font:700 11.5px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
  .orow{border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface)}
  .orow:last-child{border-bottom:0}
  .orow:hover{background:var(--surface-2)}
  .c-status{justify-self:start}
  .c-next{border:0;padding:0;margin:0}
  .c-profit small{display:none}
}
/* generic list rows (payments, expenses, stock) */
.row{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.row .amt{font:700 15px var(--font-body)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select{width:auto}
.sec-h{font:700 15px var(--font-display);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{font:500 12.5px var(--font-body);color:var(--ink-2)}
/* dialog */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog[open]{display:flex;align-items:flex-end;justify-content:center}
dialog::backdrop{background:rgba(6,12,24,.6)}
.sheet{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:94%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){dialog[open]{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-h h2{font:800 19px/1.25 var(--font-display);margin:0;min-width:0}
.sh-h .mono{display:block;color:var(--ink-2);margin-top:2px;word-break:break-all}
.f{display:grid;gap:4px;margin-bottom:12px;min-width:0}
.f>label,.lbl{font:700 11.5px var(--font-body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.hint{font-size:12.5px;color:var(--ink-2)}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .sp{flex:1}
.prev{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:4px 0 14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:800;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.tl{list-style:none;margin:0 0 6px;padding:0}
.tl li{display:flex;gap:12px;padding:5px 0 9px;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;left:5px;top:20px;bottom:-4px;width:2px;background:var(--line)}
.tl .dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);margin-top:5px;background:var(--surface)}
.tl li.done .dot{background:var(--good);border-color:var(--good)}
.tl li.late .dot{border-color:var(--bad)}
.tl b{display:block;line-height:1.3}.tl span{color:var(--ink-2);font-size:13.5px}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:12px}
.qrbox img{width:164px;height:164px;image-rendering:pixelated;background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line)}
.qrbox .qt{flex:1;min-width:180px}
.sub-h{font:800 14px var(--font-display);margin:16px 0 6px}
.alloc{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:6px;margin-bottom:6px}
.stl{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);font-size:14px}
@media (min-width:900px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.ro .wr{display:none!important}
@media (max-width:480px){.g3{grid-template-columns:1fr 1fr}.alloc{grid-template-columns:1fr 1fr}}
</style>

<script>
(function(){'use strict';
/* <calc> */
const num=v=>{const n=typeof v==='number'?v:parseFloat(v);return isFinite(n)?n:0;};
const pick=(v,d)=>(v===undefined||v===null||v==='')?d:num(v);
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const fd=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const full=s=>String(s||'').toUpperCase().replace(/\(.*?\)/g,'').replace(/[^A-Z0-9]/g,'');
const core=s=>String(s||'').toUpperCase().replace(/\(.*?\)/g,'').replace(/_\d*\s*$/,'').replace(/[^A-Z0-9]/g,'');
const DEFAULT_PLATFORMS={Meesho:{ship:2,deliver:6,pay:8},Flipkart:{ship:2,deliver:5,pay:10},Amazon:{ship:2,deliver:5,pay:7},Other:{ship:3,deliver:5,pay:7}};
function buildLinks(orders,payments){
  const byFull=new Map(),byCore=new Map(),links=new Map(),linked=new Set(),unmatched=[];
  orders.forEach(o=>{const f=full(o.orderId),c=core(o.orderId);if(f&&!byFull.has(f))byFull.set(f,o);if(c&&!byCore.has(c))byCore.set(c,o);});
  payments.forEach(p=>{
    const o=byFull.get(full(p.orderId))||byCore.get(core(p.orderId));
    if(o){if(!links.has(o.id))links.set(o.id,[]);links.get(o.id).push(p);linked.add(p.id);}else unmatched.push(p);
  });
  return {links,linked,unmatched};
}
function calcOrder(o,ctx){
  const p=ctx.prod.get(o.sku)||null;
  const qty=num(o.qty);
  const unit=num(o.price)||(p?num(p.price):0);
  const value=qty*unit;
  const gstPct=p?num(p.gst):0,feePct=p?num(p.feePct):0;
  const gst=gstPct?value-value/(1+gstPct/100):0;
  const fees=value*feePct/100;
  const ship=p?num(p.shipCharge):0;
  const cost=p?qty*num(p.cost):0;
  const st=o.status||'New';
  let profit;
  if(st==='Returned')profit=-(fees+ship);else if(st==='Cancelled')profit=0;else profit=value-gst-fees-ship-cost;
  const delivered=st==='Delivered';
  const payout=delivered?value-fees-ship:0;
  const pays=ctx.links.get(o.id)||[];
  const settled=pays.length?pays.reduce((s,x)=>s+num(x.amount)+num(x.deduction),0):num(o.receivedManual);
  const pending=delivered?Math.max(payout-settled,0):0;
  let payStatus='';
  if(delivered&&payout>0)payStatus=settled===0?'Pending':(settled<payout-1?'Short':'Received');
  const cfg=ctx.cfg(o.platform);
  const od=pd(o.date)||ctx.today,sd=pd(o.shippedDate),dd=pd(o.deliveredDate);
  const expShip=sd||addDays(od,cfg.ship);
  const expDeliver=dd||addDays(sd||expShip,cfg.deliver);
  const expPay=addDays(dd||expDeliver,cfg.pay);
  let flag='',late=0;
  if((st==='New'||st==='Packed')&&ctx.today>expShip){flag='ship';late=dayDiff(expShip,ctx.today);}
  else if(st==='Shipped'&&ctx.today>expDeliver){flag='deliver';late=dayDiff(expDeliver,ctx.today);}
  else if(delivered&&pending>0&&payStatus==='Pending'&&ctx.today>expPay){flag='pay';late=dayDiff(expPay,ctx.today);}
  return {p,qty,unit,value,gst,fees,ship,cost,profit,payout,settled,pending,payStatus,expShip,expDeliver,expPay,flag,late,pays};
}
/* </calc> */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STATUSES=['New','Packed','Shipped','Delivered','Returned','Cancelled'];
const ST_CLS={New:'p-info',Packed:'p-info',Shipped:'p-warn',Delivered:'p-good',Returned:'p-bad',Cancelled:''};
const ALLOC_TO=['New stock','Ads / Recovery','Home / Personal','Debt repaid','Savings / FD','Other'];
const todayD=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const money=n=>{n=Math.round(num(n)*100)/100;return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});};
const fmtDate=d=>{const x=typeof d==='string'?pd(d):d;if(!x)return '—';return x.getDate()+' '+MONTHS[x.getMonth()]+(x.getFullYear()!==todayD().getFullYear()?' '+String(x.getFullYear()).slice(2):'');};
const monthLabel=k=>{if(k==='all')return 'All months';const m=/^(\d{4})-(\d{2})$/.exec(k);return m?MONTHS[+m[2]-1]+' '+m[1]:k;};
const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
const sanitizeId=s=>String(s||'').trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,120);
const S={tab:'hisaab',month:'all',filter:'all',q:'',ready:false,demo:false,readOnly:false,limit:150};
const D={products:[],orders:[],payments:[],expenses:[],settings:{}};
let DB=null,DL=null,C=null,raf=0;
function cfgFor(name){
  const base=DEFAULT_PLATFORMS[name]||DEFAULT_PLATFORMS.Other;
  const o=((D.settings&&D.settings.platforms)||{})[name]||{};
  return {ship:pick(o.ship,base.ship),deliver:pick(o.deliver,base.deliver),pay:pick(o.pay,base.pay)};
}
function recompute(){
  const prod=new Map(D.products.map(p=>[p.sku,p]));
  const lk=buildLinks(D.orders,D.payments);
  const ctx={prod,links:lk.links,cfg:cfgFor,today:todayD()};
  const orders=D.orders.map(o=>({o,c:calcOrder(o,ctx)}));
  orders.sort((a,b)=>String(b.o.date||'').localeCompare(String(a.o.date||''))||String(b.o.orderId||'').localeCompare(String(a.o.orderId||'')));
  const sold=new Map();
  orders.forEach(({o})=>{if(o.status!=='Cancelled'&&o.status!=='Returned')sold.set(o.sku,(sold.get(o.sku)||0)+num(o.qty));});
  const stock=D.products.map(p=>{const s=sold.get(p.sku)||0;const cur=num(p.opening)+num(p.added)-s;
    const unitProfit=num(p.price)-(num(p.price)?num(p.price)-num(p.price)/(1+num(p.gst)/100):0)-num(p.price)*num(p.feePct)/100-num(p.shipCharge)-num(p.cost);
    return {p,sold:s,cur,alert:cur<=num(p.reorder),unitProfit};});
  stock.sort((a,b)=>String(a.p.name||'').localeCompare(String(b.p.name||'')));
  C={ctx,orders,links:lk.links,linked:lk.linked,unmatched:lk.unmatched,stock};
}
const inMonth=(key,d)=>key==='all'||String(d||'').slice(0,7)===key;
function monthKeys(){
  const s=new Set();
  [D.orders,D.expenses,D.payments].forEach(a=>a.forEach(x=>{const k=String(x.date||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(k))s.add(k);}));
  return [...s].sort().reverse();
}
function stats(key){
  const os=C.orders.filter(x=>inMonth(key,x.o.date));
  const cnt=s=>os.filter(x=>x.o.status===s).length;
  const live=os.filter(x=>x.o.status!=='Returned'&&x.o.status!=='Cancelled');
  const realized=sum(os.filter(x=>x.o.status==='Delivered'||x.o.status==='Returned'),x=>x.c.profit);
  const expected=sum(os.filter(x=>['New','Packed','Shipped'].includes(x.o.status)),x=>x.c.profit);
  const exp=sum(D.expenses.filter(e=>inMonth(key,e.date)),e=>e.amount);
  return {os,total:os.length,delivered:cnt('Delivered'),returned:cnt('Returned'),cancelled:cnt('Cancelled'),transit:os.length-cnt('Delivered')-cnt('Returned')-cnt('Cancelled'),
    sales:sum(live,x=>x.c.value),gst:sum(live,x=>x.c.gst),realized,expected,exp,net:realized-exp,
    received:sum(D.payments.filter(p=>inMonth(key,p.date)),p=>p.amount),pending:sum(os,x=>x.c.pending),
    rr:os.length?cnt('Returned')/os.length:0};
}
function flowStats(key){
  const ps=D.payments.filter(p=>inMonth(key,p.date));
  let total=0,al=0;const by={};
  ps.forEach(p=>{total+=num(p.amount);(p.alloc||[]).forEach(r=>{by[r.to]=(by[r.to]||0)+num(r.amount);al+=num(r.amount);});});
  return {total,by,left:total-al,count:ps.length};
}
function groupBy(os,keyf){
  const m=new Map();
  os.forEach(x=>{const k=keyf(x)||'—';if(!m.has(k))m.set(k,[]);m.get(k).push(x);});
  return [...m.entries()].map(([k,a])=>({k,n:a.length,sales:sum(a.filter(x=>x.o.status!=='Returned'&&x.o.status!=='Cancelled'),x=>x.c.value),
    profit:sum(a.filter(x=>x.o.status==='Delivered'||x.o.status==='Returned'),x=>x.c.profit),
    ret:a.filter(x=>x.o.status==='Returned').length,qty:sum(a.filter(x=>x.o.status==='Delivered'),x=>x.o.qty)}));
}
const FILTERS=[
  ['all','All',()=>true,1],
  ['process','To ship',x=>x.o.status==='New'||x.o.status==='Packed',1],
  ['shipped','In transit',x=>x.o.status==='Shipped',1],
  ['delivered','Delivered',x=>x.o.status==='Delivered',1],
  ['paypending','Payment pending',x=>x.c.pending>0,1],
  ['late-ship','Late dispatch',x=>x.c.flag==='ship',0],
  ['late-deliver','Late delivery',x=>x.c.flag==='deliver',0],
  ['late-pay','Late payment',x=>x.c.flag==='pay',0],
  ['short','Short payment',x=>x.c.payStatus==='Short',0],
  ['rr','Return / Cancel',x=>x.o.status==='Returned'||x.o.status==='Cancelled',1]
];
function nextInfo(r){
  const {o,c}=r,st=o.status;
  if(st==='New'||st==='Packed')return c.flag==='ship'?['Dispatch '+c.late+' days late','bad']:['Ship by '+fmtDate(c.expShip),''];
  if(st==='Shipped')return c.flag==='deliver'?['Delivery '+c.late+' days late','bad']:['Arrives ~'+fmtDate(c.expDeliver),''];
  if(st==='Delivered'){
    if(c.payout<=0)return ['',''];
    if(c.payStatus==='Received')return ['Payment received','good'];
    if(c.payStatus==='Short')return ['Short, pending '+money(c.pending),'warn'];
    return c.flag==='pay'?['Payment '+c.late+' days overdue','bad']:['Payment ~'+fmtDate(c.expPay),''];
  }
  return [st==='Returned'?'Returned':'Cancelled',''];
}
const TABS=[['hisaab','Dashboard','dash'],['orders','Orders','orders'],['payments','Payments','pay'],['expenses','Expenses','exp'],['stock','Stock','stock'],['setting','Settings','set']];
const IC={
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
  orders:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  pay:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  exp:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  stock:'<path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/>',
  set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  sales:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'
};
const ico=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
function rangeLabel(){
  const ks=monthKeys().slice().reverse();
  if(!ks.length)return 'No data yet';
  const lab=k=>MONTHS[+k.slice(5,7)-1],yr=k=>k.slice(0,4);
  if(ks.length===1)return monthLabel(ks[0]);
  const a=ks[0],b=ks[ks.length-1];
  return yr(a)===yr(b)?lab(a)+' – '+lab(b)+' '+yr(b):lab(a)+' '+yr(a)+' – '+lab(b)+' '+yr(b);
}
function monthSelect(){
  const ks=monthKeys();
  if(S.month!=='all'&&!ks.includes(S.month))S.month='all';
  return '<select class="js-month" aria-label="Choose month">'+['all',...ks].map(k=>'<option value="'+k+'"'+(k===S.month?' selected':'')+'>'+esc(monthLabel(k))+'</option>').join('')+'</select>';
}
function periodLabel(){return S.month==='all'?rangeLabel():monthLabel(S.month);}
function PH(title,right){return '<div class="ph"><div><h1>'+title+'</h1><p>Princep Kart · '+esc(periodLabel())+'</p></div><div class="ph-r">'+(right||'')+'</div></div>';}
function kpi(label,val,sub,ic,tone,cls){return '<div class="kpi"><div class="ic '+(tone||'')+'">'+ico(IC[ic])+'</div><div><span class="eyebrow">'+label+'</span><b class="num '+(cls||'')+'">'+val+'</b><span class="s">'+sub+'</span></div></div>';}
function attention(){
  const items=[];
  const n=f=>C.orders.filter(f);
  const ls=n(x=>x.c.flag==='ship'),ld=n(x=>x.c.flag==='deliver'),lp=n(x=>x.c.flag==='pay'),sh=n(x=>x.c.payStatus==='Short');
  if(ls.length)items.push({c:ls.length,cls:'p-bad',t:'Late dispatch',d:'Shipping deadline has passed',a:'filter:late-ship'});
  if(ld.length)items.push({c:ld.length,cls:'p-bad',t:'Late delivery',d:'In transit longer than expected',a:'filter:late-deliver'});
  if(lp.length)items.push({c:lp.length,cls:'p-bad',t:'Late payment',d:money(sum(lp,x=>x.c.pending))+' not received yet',a:'filter:late-pay'});
  if(sh.length)items.push({c:sh.length,cls:'p-warn',t:'Short payment',d:money(sum(sh,x=>x.c.pending))+' short',a:'filter:short'});
  const low=C.stock.filter(s=>s.alert);
  if(low.length)items.push({c:low.length,cls:'p-warn',t:'Running low on stock',d:low.slice(0,3).map(s=>s.p.name).join(', ')+(low.length>3?' and more':''),a:'tab:stock'});
  if(C.unmatched.length)items.push({c:C.unmatched.length,cls:'p-info',t:'Payment with unknown Order ID',d:'Check the Order ID or add the order',a:'tab:payments'});
  const nosku=C.orders.filter(x=>!x.c.p);
  if(nosku.length)items.push({c:nosku.length,cls:'p-info',t:'SKU not in Stock',d:'Profit is calculated only when the product is in Stock',a:'filter:all'});
  return items;
}
function chartSvg(series){
  const W=640,H=230,pl=48,pr=12,pt=24,pb=30;
  const vals=series.map(s=>s.v);
  const nice=x=>{if(x<=0)return 0;const m=Math.pow(10,Math.floor(Math.log10(x)));const f=x/m;return (f<=1?1:f<=2?2:f<=5?5:10)*m;};
  let max=nice(Math.max(0,...vals)),min=-nice(Math.max(0,...vals.map(v=>-v)));
  if(max===0&&min===0)max=100;
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
  const fmt=v=>{const a=Math.abs(v);const s=a>=100000?(a/100000).toFixed(a%100000?1:0)+'L':a>=1000?(a/1000).toFixed(a%1000?1:0)+'k':String(Math.round(a));return (v<0?'-':'')+'₹'+s;};
  const slot=(W-pl-pr)/series.length,bw=Math.min(56,slot*.55);
  let g='';
  [max,0,...(min<0?[min]:[])].forEach(t=>{g+='<line class="'+(t===0?'zero':'grid')+'" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+fmt(t)+'</text>';});
  series.forEach((s,i)=>{
    const cx=pl+slot*i+slot/2,top=Math.min(y(0),y(s.v)),h=Math.max(1,Math.abs(y(s.v)-y(0)));
    g+='<rect class="'+(s.v<0?'neg':'pos')+'" x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="3"/>';
    g+='<text class="v" x="'+cx+'" y="'+(s.v<0?top+h+13:top-5)+'" text-anchor="middle">'+fmt(s.v)+'</text>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+MONTHS[+s.k.slice(5,7)-1]+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Net profit by month" style="min-width:380px;width:100%;height:auto">'+g+'</svg>';
}
function viewHisaab(){
  const st=stats(S.month),fl=flowStats(S.month),att=attention();
  const series=monthKeys().slice(0,12).reverse().map(k=>({k,v:Math.round(stats(k).net)}));
  let h=PH('Dashboard',monthSelect());
  h+='<div class="hero"><div class="bar-g"></div><div class="eyebrow">Net profit · '+esc(periodLabel())+'</div><div class="hero-n num '+(st.net<0?'bad':'')+'">'+money(st.net)+'</div>'
   +'<div class="hero-stats"><div class="hs"><b class="num">'+money(st.realized)+'</b><span>Order profit</span></div><div class="hs"><b class="num">'+money(st.exp)+'</b><span>Expenses</span></div>'
   +(st.expected?'<div class="hs"><b class="num">~'+money(st.expected)+'</b><span>Expected from orders in transit</span></div>':'')+'</div></div>';
  h+='<div class="kpis">'+kpi('Sales',money(st.sales),st.total+' orders · '+st.delivered+' delivered','sales','')
   +kpi('Payment received',money(st.received),'in this period','pay','g')
   +kpi('Payment pending',money(st.pending),st.os.filter(x=>x.c.pending>0).length+' orders','clock','w',st.pending>0?'warn':'')
   +kpi('Return rate',(st.rr*100).toFixed(0)+'%',st.returned+' returned · '+st.cancelled+' cancelled','undo','r',st.rr>.2?'bad':'')+'</div>';
  h+='<div class="cols2"><div class="card"><div class="card-h"><h2>Needs attention</h2><small>'+att.length+' items</small></div>';
  if(!att.length)h+='<div class="empty">All good. No late orders or pending payments.</div>';
  else h+='<ul class="att">'+att.map(a=>'<li><span class="ct pill '+a.cls+'">'+a.c+'</span><div class="tx"><b>'+esc(a.t)+'</b><small>'+esc(a.d)+'</small></div><button class="btn sm" type="button" data-act="goto" data-to="'+a.a+'">View</button></li>').join('')+'</ul>';
  h+='</div><div class="card"><div class="card-h"><h2>Where the payment money went</h2><small>'+fl.count+' payments</small></div>';
  if(!fl.count)h+='<div class="empty">No payment entries in this period.</div>';
  else{
    const rows=Object.keys(fl.by).map(k=>[k,fl.by[k],0]);rows.push(['Left in account',fl.left,1]);
    const base=Math.max(Math.abs(fl.total),1);

const clean=o=>{const x=JSON.parse(JSON.stringify(o));delete x.id;return x;};

async function saveDoc(col,id,data){

function subscribe(){
  const cols=['products','orders','payments','expenses','settings'],got={};
  cols.forEach(col=>{
    const done=()=>{got[col]=1;if(cols.every(c=>got[c])){S.ready=true;}render();};
    DB.collection(col).onSnapshot(snap=>{
      if(col==='settings'){const m=snap.docs.find(d=>d.id==='main');D.settings=m?m.data():{};}
      else D[col]=snap.docs.map(d=>({id:d.id,...d.data()}));

  });
}
/* ---- QR ---- */
const cl=s=>String(s==null?'':s).replace(/[|\n\r]/g,' ').trim();
const payloadOf=(o,c)=>['KHATA',cl(o.orderId),cl(o.sku),num(o.qty)||1,cl(o.platform),cl(o.date),c?c.unit:(num(o.price)||'')].join('|');
function parsePayload(t){const p=String(t).split('|');if(p[0]!=='KHATA'||p.length<3)return null;return {orderId:p[1],sku:p[2],qty:num(p[3])||1,platform:p[4]||'',date:p[5]||'',price:num(p[6])};}
function qrUrl(text,cell){try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(cell,2);}catch(e){return '';}}
async function saveLabel(r){
  if(!DL){toast('Saving images is not available here');return;}
  const url=qrUrl(payloadOf(r.o,r.c),8);if(!url){toast('Could not create the QR');return;}
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const W=440,H=540,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingEnabled=false;
  const k=Math.max(1,Math.floor(360/img.width)),w=img.width*k;x.drawImage(img,(W-w)/2,24,w,w);
  const fit=(t,f,max)=>{x.font=f;let s=t;while(s.length>3&&x.measureText(s).width>max)s=s.slice(0,-2);return s===t?t:s+'…';};
  x.fillStyle='#111';x.textAlign='center';
  x.fillText(fit(r.c.p?r.c.p.name:r.o.sku,'700 24px sans-serif',400),W/2,24+w+44);
  x.fillText(fit(r.o.orderId,'500 17px monospace',400),W/2,24+w+76);
  x.fillText('Qty '+num(r.o.qty)+' · '+(r.o.platform||''),W/2,24+w+108);
  cv.toBlob(b=>{if(!b){toast('Could not create the image');return;}DL.save({filename:'label-'+sanitizeId(r.o.orderId)+'.png',data:b}).then(()=>toast('Label saved'),e=>{if(!e||e.code!=='declined')toast('Could not save');});},'image/png');
}

async function handleScan(raw){
  raw=String(raw||'').trim();if(!raw)return;
  if(!S.ready){toast('Data is still loading');return;}
  recompute();
  const pl=parsePayload(raw),id=pl?pl.orderId:raw,r=findOrder(id),mode=$('#scanMode').value;
  if(r){

      try{await changeStatus(r.o,target);toast(target+': '+(r.c.p?r.c.p.name:r.o.sku));}catch(e){}

  openOrderForm({platform:(pl&&pl.platform)||'Meesho',orderId:id,date:(pl&&pl.date)||fd(todayD()),sku:pl?pl.sku:'',qty:pl?pl.qty:1,price:pl&&pl.price||0,status:'New'},pl?'Filled in everything from the QR. Check it and press Save.':'This Order ID is not in the system yet. Choose a product and the rest fills in automatically.');
}
async function decodeFile(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(img);if(r&&r.length&&r[0].rawValue)return r[0].rawValue;}catch(e){}}
    if(typeof jsQR==='function'){
      for(const side of [1280,800,480]){
        const sc=Math.min(1,side/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
        const r=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(r&&r.data)return r.data;
      }
    }
  }finally{URL.revokeObjectURL(url);}
  return null;
}

async function doRestore(file){
  const msg=$('#setMsg');
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='order-khata')throw new Error('This does not look like an Order Ledger backup.');
    let n=0;
    for(const col of ['products','orders','payments','expenses']){for(const row of (j[col]||[])){if(!row||!row.id)continue;await saveDoc(col,row.id,row);n++;}}
    if(j.settings&&typeof j.settings==='object')await saveDoc('settings','main',j.settings);
    msg.className='err good';msg.textContent=n+' records restored.';
  }catch(e){msg.className='err';msg.textContent='Restore failed: '+(e&&e.message||'invalid file');}
}

  D.orders=[{id:'d1',orderId:'PE2-100000000000000001_1',platform:'Meesho',sku:'DEMO-1',qty:1,status:'Delivered',date:d(16),deliveredDate:d(8)},{id:'d2',orderId:'PE2-100000000000000002_1',platform:'Meesho',sku:'DEMO-2',qty:2,status:'Shipped',date:d(6),shippedDate:d(4)},{id:'d3',orderId:'PE2-100000000000000003_1',platform:'Flipkart',sku:'DEMO-1',qty:1,status:'New',date:d(1)},{id:'d4',orderId:'PE2-100000000000000004_1',platform:'Meesho',sku:'DEMO-2',qty:1,status:'Returned',date:d(12)}];
  D.payments=[{id:'dp1',date:d(1),orderId:'PE2-100000000000000001_1',amount:229,deduction:20,utr:'DEMO000111',account:'Sample Bank',alloc:[{to:'New stock',amount:100,note:''}]}];
  D.expenses=[{id:'de1',date:d(5),category:'Ads',description:'Sample ads expense',amount:20,mode:'From Meesho payout'}];
  D.settings={};
}
/* ---- events ---- */
let armT=0;
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(e.target===dlg()){closeDlg();return;}
  if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='tab'){S.tab=b.dataset.k;render();window.scrollTo(0,0);}
  else if(a==='filter'){S.filter=b.dataset.k;S.limit=150;render();}
  else if(a==='goto'){const [k,v]=b.dataset.to.split(':');if(k==='tab')S.tab=v;else{S.tab='orders';S.filter=v;S.month='all';}render();window.scrollTo(0,0);}
  else if(a==='close')closeDlg();
  else if(a==='new-order')openOrderForm({});
  else if(a==='open-order'){recompute();openOrder(id);}
  else if(a==='edit-order'){const o=D.orders.find(x=>x.id===id);if(o)openOrderForm(o);}
  else if(a==='new-payment')openPaymentForm({});
  else if(a==='edit-payment'){const p=D.payments.find(x=>x.id===id);if(p)openPaymentForm(p);}
  else if(a==='new-expense')openExpenseForm({});
  else if(a==='edit-expense'){const x=D.expenses.find(q=>q.id===id);if(x)openExpenseForm(x);}
  else if(a==='new-product')openProductForm({});
  else if(a==='edit-product'){const p=D.products.find(x=>x.id===id);if(p)openProductForm(p);}
  else if(a==='alloc-add'){$('#allocs').insertAdjacentHTML('beforeend',allocRow({}));}
  else if(a==='alloc-del'){b.closest('.alloc').remove();updatePayHints();}
  else if(a==='copy-qr'){const r=C.orders.find(x=>x.o.id===id);if(r)copyText(payloadOf(r.o,r.c));}
  else if(a==='save-qr'){const r=C.orders.find(x=>x.o.id===id);if(r)saveLabel(r);}
  else if(a==='export')doExport(b.dataset.k);
  else if(a==='status'){const o=D.orders.find(x=>x.id===id);if(o){try{await changeStatus(o,b.dataset.s);recompute();openOrder(id);toast('Status: '+b.dataset.s);}catch(er){}}}
  else if(a==='del'){
    if(!b.dataset.armed){b.dataset.armed='1';b.dataset.t=b.textContent;b.textContent='Sure? Tap again';clearTimeout(armT);armT=setTimeout(()=>{b.textContent=b.dataset.t;delete b.dataset.armed;},4000);return;}
    try{await delDoc(b.dataset.col,id);toast('Deleted');closeDlg();}catch(er){}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('js-month')){S.month=t.value;S.limit=150;render();}
  else if(t.id==='scanFile'){const f=t.files&&t.files[0];t.value='';if(!f)return;toast('Looking for the QR…');decodeFile(f).then(txt=>{if(txt)handleScan(txt);else toast('No QR found. Take a closer, straight-on photo or type the Order ID.');},()=>toast('Could not open the photo'));}
  else if(t.id==='restoreFile'){const f=t.files&&t.files[0];t.value='';if(f)doRestore(f);}
  else if(t.id==='f_status'){
    const st=t.value,td=fd(todayD());
    if(st==='Shipped'&&!$('#f_shipped').value)$('#f_shipped').value=td;
    if(st==='Delivered'&&!$('#f_delivered').value)$('#f_delivered').value=td;
    updatePreview();
  }else if(t.closest&&t.closest('#orderForm'))updatePreview();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;S.limit=150;renderOrdersList();}
  else if(t.closest&&t.closest('#orderForm'))updatePreview();
  else if(t.closest&&t.closest('#payForm'))updatePayHints();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='scanIn'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';handleScan(v);}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(S.readOnly&&f.id!=='setForm')return;
  if(f.id==='orderForm')submitOrder(f);
  else if(f.id==='payForm')submitPayment(f);
  else if(f.id==='expForm')submitExpense(f);
  else if(f.id==='prodForm')submitProduct(f);
  else if(f.id==='setForm'){
    const fd2=new FormData(f),pl={},n=num(fd2.get('count'));
    for(let i=0;i<n;i++){const nm=fd2.get('n'+i);if(nm)pl[nm]={ship:num(fd2.get('ship'+i)),deliver:num(fd2.get('deliver'+i)),pay:num(fd2.get('pay'+i))};}
    saveDoc('settings','main',{...D.settings,platforms:pl}).then(()=>toast('Timeline saved'),()=>{});
  }
});
/* ---- boot ---- */
async function boot(){
  renderNow();
  const cu=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):()=>Promise.resolve(null);
  DB=await cu('db');DL=await cu('downloads');
  const u=await cu('user');
  try{if(u&&typeof u.can==='function'&&u.can('data.write')===false)S.readOnly=true;}catch(e){}
  if(DB)subscribe();else{S.demo=true;loadDemo();S.ready=true;render();}
}
boot();
})();
</script>
